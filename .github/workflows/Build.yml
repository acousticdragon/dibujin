name: Compilar apps (Android y Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install --omit=dev
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Permisos (cámara, micrófono, vibración)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Ícono de la app (opcional)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0d0d11' --iconBackgroundColorDark '#0d0d11'
      - name: Copiar juego al proyecto
        run: npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mafia-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Crear instalador
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Mafia-Windows-instalador
          path: dist/*.exe
