function netJoin(code,h,ctl){ctl=ctl||{};return new Promise((ok,fail)=>{const hs={},cbs=[];let pres={},pr={},conns=[],hc=null,myid=null,done=0;
const bad=e=>{if(!done){done=1;try{peer.destroy()}catch(x){}fail(e)}};
const fire=(t,d)=>(hs[t]||[]).forEach(f=>{try{f({topic:t,data:d})}catch(e){console.error(e)}});
const list=()=>Object.keys(pr).map(id=>({peer:id,isMe:id==myid,presence:pr[id]}));
const notify=()=>{const l=list();cbs.forEach(f=>f({peers:l}))};
const sendAll=(m,t,d)=>conns.forEach(c=>{if(!c._ok)return;if(R.route&&t&&!R.route(t,d,c.peer))return;try{c.send(m)}catch(e){}});
const R={get peer(){return peer},ids:()=>Object.keys(pr),emit:async(t,d)=>{if(h){fire(t,d);sendAll({k:"msg",t,d},t,d)}else if(hc&&hc.open)hc.send({k:"emit",t,d})},
on:(t,f)=>{(hs[t]=hs[t]||[]).push(f)},
presence:async p=>{Object.assign(pres,p);if(h){pr[myid]=pres;sendAll({k:"peers",pr});notify()}else if(hc&&hc.open)hc.send({k:"pres",p:pres})},
peers:()=>list(),onPeers:f=>{cbs.push(f)},leave:async()=>{try{peer.destroy()}catch(e){}}};
R.verdict=(c,d)=>{if(d.r=="ok"){c._ok=1;try{c.send({k:"ok"});c.send({k:"peers",pr})}catch(e){}}else if(d.r=="wait"){try{c.send({k:"wait"})}catch(e){}}else{try{c.send({k:"deny",w:d.w})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},300)}};
R.kick=(id,ban)=>{const c=conns.find(x=>x.peer==id);if(c){try{c.send({k:"kick",ban:ban?1:0})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}conns=conns.filter(x=>x!==c);delete pr[id];sendAll({k:"peers",pr});notify()},400)}};
if(ctl.reg)ctl.reg(()=>bad(new Error("cancelado")));
const peer=h?new Peer(PFX+code.toLowerCase(),PO):new Peer(PO);
if(h)setTimeout(()=>{if(!done)bad(new Error("El servidor de conexión no responde"))},10000);
peer.on("error",e=>{if(!done)bad(e);else toast("Problema de conexión")});
peer.on("call",c=>{if(!G||G.mode!="host")return;hostCall(c)});
peer.on("open",id=>{myid=id;
if(h){pr[id]=pres;done=1;ok(R);peer.on("connection",c=>{conns.push(c);
c.on("data",m=>{if(!c._ok){if(m&&m.k=="hello"&&!c._h){c._h=1;R.verdict(c,R.gate?R.gate(c,m):{r:"ok"})}return}if(m.k=="pres"){Object.keys(pr).forEach(k=>{if(k!=c.peer&&k!=myid&&pr[k]&&m.p.did&&pr[k].did==m.p.did){delete pr[k];const o=conns.find(x=>x.peer==k);if(o)try{o.send({k:"kick",ban:0,dup:1});setTimeout(()=>{try{o.close()}catch(e){}},300)}catch(e){}}});pr[c.peer]=m.p;sendAll({k:"peers",pr});notify()}else if(m.k=="emit"){fire(m.t,m.d);sendAll({k:"msg",t:m.t,d:m.d},m.t,m.d)}});
c.on("close",()=>{conns=conns.filter(x=>x!=c);delete pr[c.peer];if(R.onleave)R.onleave(c.peer);sendAll({k:"peers",pr});notify()});
})}
else{hc=peer.connect(PFX+code.toLowerCase(),{reliable:true});const to=setTimeout(()=>bad(new Error("timeout")),16000);
let to2=null;hc.on("open",()=>{try{hc.send({k:"hello",pw:ctl.pw||"",did:S.did,name:S.name})}catch(e){}});
hc.on("data",m=>{if(!m)return;if(m.k=="ok"){clearTimeout(to);clearTimeout(to2);done=1;ok(R)}else if(m.k=="wait"){clearTimeout(to);to2=setTimeout(()=>bad(new Error("sin respuesta")),120000)}else if(m.k=="deny"){bad(Object.assign(new Error("denegado"),{type:"deny",why:m.w}))}else if(m.k=="kick"){R.kicked=1;if(R.onkick)R.onkick(m.ban,m.dup)}else if(m.k=="peers"){pr=m.pr;notify()}else if(m.k=="msg")fire(m.t,m.d)});
hc.on("close",()=>{if(!done)bad(new Error("conexión cerrada"));else if(!R.kicked&&R.onlost)R.onlost()})}})})}
